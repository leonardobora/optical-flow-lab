<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Optical Flow Lab</title>
<link rel="stylesheet" href="styles (1).css">
<style>
.main-layout{display:grid;grid-template-columns:320px 1fr 320px;gap:18px;padding:18px}
.side-panel{background:#fff;border:1px solid #e4e4ea;border-radius:8px;padding:16px;overflow:auto;max-height:calc(100vh - 140px)}
.canvas-stage{min-width:0}
@media(max-width:1200px){.main-layout{grid-template-columns:1fr}.side-panel{max-height:none}}
</style>
</head>
<body>
<div class="app-shell">
<div class="topbar"><div class="brand-lockup"><div class="brand-mark"></div><div class="brand-copy"><span>Lean</span><strong>Optical Flow Lab</strong></div></div><div class="score-strip"><div><span>Capital</span><strong id="money">$0</strong></div><div><span>Entregues</span><strong id="delivered">0</strong></div><div><span>Flow Score</span><strong id="flowScore">0%</strong></div><div><span>Rodada</span><strong id="round">1/5</strong></div></div></div>
<div class="control-band"><div class="round-clock"><div id="statusDot" class="status-dot"></div><div><span id="phaseLabel">Preparar linha optica</span><strong id="clock">01:00</strong></div></div><div class="actions"><button id="startBtn" class="control-btn go">Iniciar</button><button id="pauseBtn" class="control-btn stop">Pausar</button><button id="resetBtn" class="control-btn neutral">Resetar</button></div></div>
<div class="main-layout">
<aside class="side-panel">
<h2>Controles</h2>
<div class="tool-grid">
<button id="compactBtn" class="tool-btn connect">Compactar <small id="changes">2</small></button>
<button id="analystBtn" class="tool-btn engineer">Eng. Lean</button>
<button id="marketerBtn" class="tool-btn market">Marketing</button>
<button id="sellTruckBtn" class="tool-btn danger">Vender AGV</button>
</div>
<div class="selected-card"><span>Estação Selecionada</span><strong id="selectedName">-</strong><p id="selectedText"></p></div>
<div class="event-log"><ol id="log"></ol></div>
</aside>
<section class="canvas-stage">
<div class="factory-wrap">
<div class="factory-header">
<div><span>Layout</span><strong id="layoutMode"></strong></div>
<div><span>AGV</span><strong id="truckState"></strong></div>
<div><span>Lote</span><strong id="batchSize"></strong></div>
</div>
<div class="swimlane-scroll"><div id="factory" class="factory-lane"></div></div>
</div>
</section>
<aside class="side-panel">
<h2>Métricas</h2>
<div class="metric-list">
<label><span>Pedidos</span><strong id="ordersText">0</strong><meter id="ordersMeter" min="0" max="50"></meter></label>
<label><span>WIP</span><strong id="wipText">0</strong><meter id="wipMeter" min="0" max="50"></meter></label>
<label><span>Lead Time</span><strong id="leadText">0s</strong><meter id="leadMeter" min="0" max="100"></meter></label>
<label><span>Scrap</span><strong id="scrapText">0</strong><meter id="scrapMeter" min="0" max="50"></meter></label>
</div>
<div class="insight-box"><span>Diagnóstico</span><p id="diagnostic"></p></div>
<div class="waste-panel"><div class="waste-heading"><strong>7 Desperdícios</strong></div><div id="wasteList" class="waste-list"></div></div>
</aside>
</div></div>
<script src="script (1).js"></script>
</body></html>
